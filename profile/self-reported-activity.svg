<svg width="960" height="250" viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Activity map timeline">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0b1220"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="dev" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>
<style>
.title { fill: #e5e7eb; font: 700 20px "Consolas", "Courier New", monospace; letter-spacing: 1px; }
.sub { fill: #94a3b8; font: 11px "Consolas", "Courier New", monospace; }
.label { fill: #dbeafe; font: 600 11px "Consolas", "Courier New", monospace; }
.tick { fill: #94a3b8; font: 10px "Consolas", "Courier New", monospace; }
.devText { fill: #0b1220; font: 700 10px "Consolas", "Courier New", monospace; }
.restText { fill: #f1f5f9; font: 700 10px "Consolas", "Courier New", monospace; }
.track { fill: #1f2937; }
.rest { fill: #475569; }
</style>
</defs>
<rect x="0" y="0" width="960" height="250" rx="14" fill="url(#bg)"/>
<rect x="18" y="16" width="924" height="218" rx="10" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>
<text class="title" x="42" y="45">ACTIVITY MAP</text>
<text class="sub" x="42" y="64">Based on GitHub contribution graph</text>
<text class="sub" x="680" y="45">UPDATED 2026-08-30</text>
<text class="sub" x="610" y="64">LAST 6M UNITS 13 / ACTIVE 3 (1.6%)</text>
<rect class="track" x="72" y="108" width="816" height="30" rx="15"/>
<rect x="72" y="108" width="49" height="30" rx="15" fill="url(#dev)"/>
<text class="devText" x="96" y="127" text-anchor="middle">DEV</text>
<rect x="121" y="108" width="337" height="30" rx="15" fill="#475569"/>
<text class="restText" x="289" y="127" text-anchor="middle">REST</text>
<rect x="458" y="108" width="4" height="30" rx="15" fill="url(#dev)"/>
<rect x="462" y="108" width="426" height="30" rx="15" fill="#475569"/>
<text class="restText" x="675" y="127" text-anchor="middle">REST</text>
<line x1="72" y1="144" x2="72" y2="158" stroke="#64748b" stroke-width="1"/>
<text class="tick" x="72" y="173" text-anchor="middle">2026-02-28</text>
<line x1="458" y1="144" x2="458" y2="158" stroke="#64748b" stroke-width="1"/>
<text class="tick" x="458" y="173" text-anchor="middle">2026-05-26</text>
<line x1="888" y1="144" x2="888" y2="158" stroke="#64748b" stroke-width="1"/>
<text class="tick" x="888" y="173" text-anchor="middle">NOW</text>
<text class="label" x="72" y="204">2026-02-28 ~ 2026-03-10 DEV</text>
<text class="label" x="72" y="222">2026-03-11 ~ 2026-05-25 REST</text>
<text class="label" x="72" y="240">2026-05-27 ~ NOW REST</text>
<text class="label" x="560" y="222">@JWookLe contribution timeline</text>
</svg>